name: Daily Horizon Summary

on:
  schedule:
    # Weekdays, Asia/Shanghai (no DST). GitHub honors timezone on each cron
    # (workflow syntax; GA March 2026). It is not ignored here: the 2026-11-09
    # runs were created at 07:16Z and 07:52Z, which is before 08:52 UTC, so
    # `52 8` / `7 9` were not evaluated as UTC. Equivalent UTC times are noted
    # on each slot below.
    #
    # Do not add a slot before 08:00 Asia/Shanghai. Horizon names Pages posts
    # with datetime.now(timezone.utc) (docs/_posts/YYYY-MM-DD-summary-<lang>.md).
    # An on-time 07:xx Shanghai start is still the previous UTC date and would
    # publish yesterday's filename. Every cron below is 08:52 or later.
    #
    # Schedules in the 00:xx and 01:xx UTC hours have been created about 6.5h
    # late on this repo, and the job itself then finishes in about 5 minutes
    # (createdAt ≈ startedAt; the delay is schedule dispatch, not DashScope):
    #   00:38 UTC → 2026-11-05 07:20Z (+6h42m), 2026-11-06 07:18Z (+6h40m)
    #   00:52 and 01:07 UTC → 2026-11-09 07:16Z and 07:52Z (about +6.5h).
    #   Those runs did not record github.event.schedule; in schedule order
    #   that is +6h24m and +6h45m. Either pairing is still a 6–7h delay.
    # Moving the minute inside the midnight hour did not help, and the 09:07
    # Shanghai / 01:07 UTC fallback was in the same delay bucket, so it missed
    # the ~09:15 mail check too. Later slots are separate schedule events
    # outside those two hours. The already-published gate skips Horizon once
    # today's gh-pages posts exist, so a catch-up does not call DashScope again.
    #
    # 08:52 Shanghai (00:52 UTC). Morning attempt. Minute 52 stays off :00.
    # On time, the run finishes near 08:57, before the ~09:15 mail routine.
    # In the slow queue this slot has landed mid-afternoon; it stays so a
    # fast day still makes the morning check.
    - cron: '52 8 * * 1-5'
      timezone: "Asia/Shanghai"
    # 12:17 Shanghai (04:17 UTC). Midday catch-up, outside the 00:xx and 01:xx
    # UTC hours measured above, and not minute 0. If this hour is not in that
    # same queue, the digest is published around midday. If it is queued with
    # the morning slot, the gate no-ops once that slot has published.
    - cron: '17 12 * * 1-5'
      timezone: "Asia/Shanghai"
    # 15:23 Shanghai (07:23 UTC). Same-afternoon catch-up in a later UTC hour
    # (public schedule measurements treat 07:00 UTC onward as quieter than
    # 00:00–06:59). Covers a dropped 08:52 and a dropped 12:17, and still
    # publishes the same afternoon when it starts near on time. If an earlier
    # slot already published, the gate skips Horizon.
    - cron: '23 15 * * 1-5'
      timezone: "Asia/Shanghai"
  workflow_dispatch:      # Allow manual trigger

# A delayed morning run can overlap a later catch-up. Publish one at a time;
# the waiter then sees today's posts and skips.
concurrency:
  group: daily-horizon-summary
  cancel-in-progress: false

jobs:
  already-published:
    name: Already published today?
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - name: Skip a schedule slot when today's Pages posts exist
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        shell: bash
        run: |
          set -u

          emit() {
            echo "run=$1" >> "$GITHUB_OUTPUT"
            printf '%s\n' "$2"
          }

          printf 'event=%s schedule=%s\n' "$GITHUB_EVENT_NAME" "${EVENT_SCHEDULE:-}"

          if [ "${GITHUB_EVENT_NAME}" != "schedule" ]; then
            emit true "workflow_dispatch always generates a digest."
            exit 0
          fi

          shanghai_today="$(TZ=Asia/Shanghai date +%Y-%m-%d)"
          utc_today="$(date -u +%Y-%m-%d)"
          # These crons are after 00:00 UTC, so the dates match on an on-time
          # run. Horizon's filename uses the UTC date. If a delay crosses
          # midnight in Shanghai, generate rather than skip the wrong day.
          if [ "$shanghai_today" != "$utc_today" ]; then
            emit true "Shanghai date ${shanghai_today} != UTC date ${utc_today}; not skipping."
            exit 0
          fi

          if [ -z "${GH_TOKEN:-}" ]; then
            emit true "GITHUB_TOKEN is empty; generating."
            exit 0
          fi

          tmp="$(mktemp)"
          config_code="000"
          if config_code="$(curl -sS --max-time 20 -o "$tmp" -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github.raw" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/data/config.github.json?ref=${GITHUB_SHA}")"; then
            :
          else
            config_code="000"
          fi

          if [ "$config_code" != "200" ]; then
            emit true "Could not read config.github.json (HTTP ${config_code}); generating."
            exit 0
          fi

          if ! langs="$(jq -r '.ai.languages[]' "$tmp")"; then
            emit true "Could not parse ai.languages; generating."
            exit 0
          fi

          if [ -z "$langs" ]; then
            emit true "No languages configured; generating."
            exit 0
          fi

          missing=0
          while IFS= read -r lang; do
            [ -n "$lang" ] || continue
            path="_posts/${utc_today}-summary-${lang}.md"
            code="000"
            if code="$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${path}?ref=gh-pages")"; then
              :
            else
              code="000"
            fi
            printf '%s -> HTTP %s\n' "$path" "$code"
            if [ "$code" != "200" ]; then
              missing=1
            fi
          done <<< "$langs"

          if [ "$missing" = "0" ]; then
            emit false "All ${utc_today} summary posts are already on gh-pages; skipping Horizon."
          else
            emit true "Today's summary is not fully published; running Horizon."
          fi

  daily-summary:
    needs: already-published
    if: needs.already-published.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed to commit changes

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"

      - name: Install dependencies
        run: uv sync

      - name: Prepare GitHub Actions config
        run: cp data/config.github.json data/config.json

      - name: Run Horizon
        env:
          # config.github.json uses provider "ali" (DashScope / 通义,
          # api_key_env DASHSCOPE_API_KEY, model qwen-plus,
          # base_url https://dashscope.aliyuncs.com/compatible-mode/v1).
          # OPENAI_API_KEY, ANTHROPIC_API_KEY, and GOOGLE_API_KEY are unused with this provider.
          # Feishu is disabled, so HORIZON_WEBHOOK_URL is not mapped.
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          LWN_KEY: ${{ secrets.LWN_KEY }}
        run: uv run horizon --hours 24

      - name: Set current date as environment variable
        run: echo "DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true  # Keep existing summaries on gh-pages branch
          commit_message: "📝 Daily Summary: ${{ env.DATE }}"
          publish_branch: gh-pages
          enable_jekyll: true
