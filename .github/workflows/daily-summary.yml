name: Daily Horizon Summary

on:
  schedule:
    # Every day, including Saturday and Sunday, Asia/Shanghai (no DST).
    # GitHub honors timezone on each cron (workflow syntax; GA March 2026).
    # It is not ignored here: the 2026-11-09 runs were created at 07:16Z and
    # 07:52Z, which is before 08:52 UTC, so those crons were not evaluated as
    # UTC. Equivalent UTC times are noted on each slot below.
    #
    # Pages posts are named with the Asia/Shanghai date
    # (docs/_posts/YYYY-MM-DD-summary-<lang>.md). An overnight run still
    # writes today's filename. GitHub schedule dispatch on this repo is
    # consistently 6.5–8 hours late, and the job then finishes in about
    # 5 minutes (createdAt ≈ startedAt; the delay is schedule dispatch, not
    # DashScope). The 00:17 slot is the one aimed at the 08:30 mail window:
    # 00:17 + 6.5h ≈ 06:47, +8h ≈ 08:17. Later slots are same-day catch-ups.
    # The already-published gate skips Horizon once every configured language
    # post for Shanghai today exists on gh-pages. workflow_dispatch with
    # empty inputs still generates today. A past digest_date is preview-only.
    #
    # Measured delay, createdAt ≈ startedAt:
    #   00:38 UTC → 2026-11-05 07:20Z (+6h42m), 2026-11-06 07:18Z (+6h40m)
    #   00:52 and 01:07 UTC → 2026-11-09 07:16Z and 07:52Z (about +6.5h).
    #   Those runs did not record github.event.schedule; in schedule order
    #   that is +6h24m and +6h45m. The same 6.5–8h pattern held through
    #   2026-11-16. Moving the minute inside the midnight UTC hour did not
    #   help, which is why the early slot is 00:17 Shanghai rather than a
    #   morning-only schedule.
    #
    # 00:17 Shanghai (16:17 UTC, previous day). Early slot. Minute 17 stays
    # off :00. A 6.5–8h dispatch delay still usually publishes before 08:30.
    - cron: '17 0 * * *'
      timezone: "Asia/Shanghai"
    # 08:52 Shanghai (00:52 UTC). Same-day catch-up if 00:17 has not published.
    # The gate skips Horizon when Shanghai today's posts are already on gh-pages.
    - cron: '52 8 * * *'
      timezone: "Asia/Shanghai"
    # 12:17 Shanghai (04:17 UTC). Midday catch-up, not minute 0. Skips Horizon
    # when Shanghai today's posts already exist.
    - cron: '17 12 * * *'
      timezone: "Asia/Shanghai"
    # 15:23 Shanghai (07:23 UTC). Afternoon catch-up. Covers a dropped 00:17,
    # 08:52, and 12:17. Skips Horizon when an earlier slot already published.
    - cron: '23 15 * * *'
      timezone: "Asia/Shanghai"
  workflow_dispatch:      # Allow manual trigger
    inputs:
      digest_date:
        description: "Optional YYYY-MM-DD. A date other than Asia/Shanghai today is a published-page preview only and is not published."
        required: false
        type: string
        default: ""
      dry_run:
        description: "Skip gh-pages publish and delivery. A past digest_date forces this."
        required: false
        type: boolean
        default: false

# A delayed overnight run can overlap a later catch-up. Publish one at a time;
# the waiter then sees today's Shanghai posts and skips.
concurrency:
  group: daily-horizon-summary
  cancel-in-progress: false

jobs:
  already-published:
    name: Already published today?
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - name: Skip a schedule slot when today's Pages posts exist
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        shell: bash
        run: |
          set -u

          emit() {
            echo "run=$1" >> "$GITHUB_OUTPUT"
            printf '%s\n' "$2"
          }

          printf 'event=%s schedule=%s\n' "$GITHUB_EVENT_NAME" "${EVENT_SCHEDULE:-}"

          if [ "${GITHUB_EVENT_NAME}" != "schedule" ]; then
            emit true "workflow_dispatch always generates a digest."
            exit 0
          fi

          # Filenames use the Asia/Shanghai date. A delayed slot after Shanghai
          # midnight checks that date: skip when those posts already exist,
          # and generate Shanghai today when they do not.
          shanghai_today="$(TZ=Asia/Shanghai date +%Y-%m-%d)"

          if [ -z "${GH_TOKEN:-}" ]; then
            emit true "GITHUB_TOKEN is empty; generating."
            exit 0
          fi

          tmp="$(mktemp)"
          config_code="000"
          if config_code="$(curl -sS --max-time 20 -o "$tmp" -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github.raw" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/data/config.github.json?ref=${GITHUB_SHA}")"; then
            :
          else
            config_code="000"
          fi

          if [ "$config_code" != "200" ]; then
            emit true "Could not read config.github.json (HTTP ${config_code}); generating."
            exit 0
          fi

          if ! langs="$(jq -r '.ai.languages[]' "$tmp")"; then
            emit true "Could not parse ai.languages; generating."
            exit 0
          fi

          if [ -z "$langs" ]; then
            emit true "No languages configured; generating."
            exit 0
          fi

          missing=0
          while IFS= read -r lang; do
            [ -n "$lang" ] || continue
            path="_posts/${shanghai_today}-summary-${lang}.md"
            code="000"
            if code="$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${path}?ref=gh-pages")"; then
              :
            else
              code="000"
            fi
            printf '%s -> HTTP %s\n' "$path" "$code"
            if [ "$code" != "200" ]; then
              missing=1
            fi
          done <<< "$langs"

          if [ "$missing" = "0" ]; then
            emit false "All ${shanghai_today} summary posts are already on gh-pages; skipping Horizon."
          else
            emit true "Shanghai ${shanghai_today} summary is not fully published; running Horizon."
          fi

  daily-summary:
    needs: already-published
    if: needs.already-published.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed to commit changes
      actions: write   # Needed to upload the dry-run digest artifact

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"

      - name: Install dependencies
        run: uv sync

      - name: Prepare GitHub Actions config
        run: cp data/config.github.json data/config.json

      - name: Decide live run or historical preview
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_DATE: ${{ github.event_name == 'workflow_dispatch' && inputs.digest_date || '' }}
          REQUESTED_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
        run: |
          export SHANGHAI_TODAY="$(TZ=Asia/Shanghai date +%Y-%m-%d)"
          uv run python - <<'PY'
          import os
          from src.replay import plan_digest_run

          plan = plan_digest_run(
              event=os.environ["EVENT_NAME"],
              shanghai_today=os.environ["SHANGHAI_TODAY"],
              requested_date=os.environ.get("REQUESTED_DATE") or None,
              dry_run=os.environ.get("REQUESTED_DRY_RUN") == "true",
          )
          path = os.environ["GITHUB_OUTPUT"]
          with open(path, "a", encoding="utf-8") as handle:
              handle.write(f"mode={plan.mode}\n")
              handle.write(f"digest_date={plan.digest_date}\n")
              handle.write(f"run_live={str(plan.run_live_horizon).lower()}\n")
              handle.write(f"publish={str(plan.publish).lower()}\n")
              handle.write(f"dry_run={str(plan.dry_run).lower()}\n")
          print(
              f"mode={plan.mode} date={plan.digest_date} "
              f"live={plan.run_live_horizon} publish={plan.publish}"
          )
          PY

      - name: Run Horizon
        if: steps.plan.outputs.run_live == 'true'
        env:
          # config.github.json uses provider "ali" (DashScope / 通义,
          # api_key_env DASHSCOPE_API_KEY, model qwen-plus,
          # base_url https://dashscope.aliyuncs.com/compatible-mode/v1).
          # OPENAI_API_KEY, ANTHROPIC_API_KEY, and GOOGLE_API_KEY are unused with this provider.
          # Feishu is disabled, so HORIZON_WEBHOOK_URL is not mapped.
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          LWN_KEY: ${{ secrets.LWN_KEY }}
        run: |
          if [ "${{ steps.plan.outputs.dry_run }}" = "true" ]; then
            uv run horizon --hours 24 --dry-run --digest-date "${{ steps.plan.outputs.digest_date }}"
          else
            uv run horizon --hours 24
          fi

      # A live dry-run writes data/previews/horizon-<date>-<lang>.md and does
      # not write docs/_posts, send mail, or publish. Keep that output. Scheduled
      # and manual-live runs publish instead, so they do not upload here.
      - name: Upload dry-run digest
        if: >-
          steps.plan.outputs.mode == 'dry-run' &&
          steps.plan.outputs.dry_run == 'true' &&
          steps.plan.outputs.run_live == 'true' &&
          steps.plan.outputs.publish == 'false'
        uses: actions/upload-artifact@v7
        with:
          name: horizon-preview-${{ steps.plan.outputs.digest_date }}
          if-no-files-found: warn
          path: |
            data/previews/horizon-${{ steps.plan.outputs.digest_date }}-*.md
            docs/_posts/${{ steps.plan.outputs.digest_date }}-summary-*.md
            docs/_posts/${{ steps.plan.outputs.digest_date }}-summary-*.html
            docs/**/*${{ steps.plan.outputs.digest_date }}*summary*.html

      - name: Replay the published page without fetching
        if: steps.plan.outputs.mode == 'historical-preview'
        run: |
          set -eu
          date="${{ steps.plan.outputs.digest_date }}"
          year="${date%%-*}"
          rest="${date#*-}"
          month="${rest%%-*}"
          day="${rest#*-}"
          owner="${GITHUB_REPOSITORY%%/*}"
          base="https://${owner}.github.io/Horizon"
          mkdir -p previews/replay
          curl -fsSL -o "previews/replay/${date}-published.html" \
            "${base}/${year}/${month}/${day}/summary-zh.html"
          curl -fsSL -o previews/replay/style.css \
            "${base}/assets/css/style.css"
          uv run python scripts/render_ai_native_preview.py \
            --live-html "previews/replay/${date}-published.html" \
            --sources previews/2026-11-23-ai-native-sources.json \
            --theme-css previews/replay/style.css \
            --horizon-css docs/assets/css/horizon.css \
            --horizon-js docs/assets/js/horizon.js \
            --replay-date "$date" \
            --out "previews/replay/${date}-ai-native.html"
          echo "Wrote previews/replay/${date}-ai-native.html. Did not call DashScope or publish."

      - name: Set current date as environment variable
        # Match the Pages post filename, which is the Asia/Shanghai date.
        # The runner clock is UTC, so an unzoned `date` would be yesterday
        # during an overnight slot.
        run: echo "DATE=$(TZ=Asia/Shanghai date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Deploy to GitHub Pages
        if: steps.plan.outputs.publish == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true  # Keep existing summaries on gh-pages branch
          commit_message: "📝 Daily Summary: ${{ env.DATE }}"
          publish_branch: gh-pages
          enable_jekyll: true
