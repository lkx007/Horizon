name: Daily Horizon Summary

on:
  schedule:
    # Every day, including Saturday and Sunday, Asia/Shanghai (no DST).
    # GitHub honors timezone on each cron (workflow syntax; GA March 2026).
    # It is not ignored here: the 2026-11-09 runs were created at 07:16Z and
    # 07:52Z, which is before 08:52 UTC, so those crons were not evaluated as
    # UTC. Equivalent UTC times are noted on each slot below.
    #
    # Pages posts are named with the Asia/Shanghai date
    # (docs/_posts/YYYY-MM-DD-summary-<lang>.md). An overnight run still
    # writes today's filename. GitHub schedule dispatch on this repo is
    # consistently 6.5–8 hours late, and the job then finishes in about
    # 5 minutes (createdAt ≈ startedAt; the delay is schedule dispatch, not
    # DashScope). The 00:17 slot is the one aimed at the 08:30 mail window:
    # 00:17 + 6.5h ≈ 06:47, +8h ≈ 08:17. Later slots are same-day catch-ups.
    # The already-published gate skips Horizon once every configured language
    # post for Shanghai today exists on gh-pages. workflow_dispatch always
    # generates.
    #
    # Measured delay, createdAt ≈ startedAt:
    #   00:38 UTC → 2026-11-05 07:20Z (+6h42m), 2026-11-06 07:18Z (+6h40m)
    #   00:52 and 01:07 UTC → 2026-11-09 07:16Z and 07:52Z (about +6.5h).
    #   Those runs did not record github.event.schedule; in schedule order
    #   that is +6h24m and +6h45m. The same 6.5–8h pattern held through
    #   2026-11-16. Moving the minute inside the midnight UTC hour did not
    #   help, which is why the early slot is 00:17 Shanghai rather than a
    #   morning-only schedule.
    #
    # 00:17 Shanghai (16:17 UTC, previous day). Early slot. Minute 17 stays
    # off :00. A 6.5–8h dispatch delay still usually publishes before 08:30.
    - cron: '17 0 * * *'
      timezone: "Asia/Shanghai"
    # 08:52 Shanghai (00:52 UTC). Same-day catch-up if 00:17 has not published.
    # The gate skips Horizon when Shanghai today's posts are already on gh-pages.
    - cron: '52 8 * * *'
      timezone: "Asia/Shanghai"
    # 12:17 Shanghai (04:17 UTC). Midday catch-up, not minute 0. Skips Horizon
    # when Shanghai today's posts already exist.
    - cron: '17 12 * * *'
      timezone: "Asia/Shanghai"
    # 15:23 Shanghai (07:23 UTC). Afternoon catch-up. Covers a dropped 00:17,
    # 08:52, and 12:17. Skips Horizon when an earlier slot already published.
    - cron: '23 15 * * *'
      timezone: "Asia/Shanghai"
  workflow_dispatch:      # Allow manual trigger

# A delayed overnight run can overlap a later catch-up. Publish one at a time;
# the waiter then sees today's Shanghai posts and skips.
concurrency:
  group: daily-horizon-summary
  cancel-in-progress: false

jobs:
  already-published:
    name: Already published today?
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - name: Skip a schedule slot when today's Pages posts exist
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        shell: bash
        run: |
          set -u

          emit() {
            echo "run=$1" >> "$GITHUB_OUTPUT"
            printf '%s\n' "$2"
          }

          printf 'event=%s schedule=%s\n' "$GITHUB_EVENT_NAME" "${EVENT_SCHEDULE:-}"

          if [ "${GITHUB_EVENT_NAME}" != "schedule" ]; then
            emit true "workflow_dispatch always generates a digest."
            exit 0
          fi

          # Filenames use the Asia/Shanghai date. A delayed slot after Shanghai
          # midnight checks that date: skip when those posts already exist,
          # and generate Shanghai today when they do not.
          shanghai_today="$(TZ=Asia/Shanghai date +%Y-%m-%d)"

          if [ -z "${GH_TOKEN:-}" ]; then
            emit true "GITHUB_TOKEN is empty; generating."
            exit 0
          fi

          tmp="$(mktemp)"
          config_code="000"
          if config_code="$(curl -sS --max-time 20 -o "$tmp" -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github.raw" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/data/config.github.json?ref=${GITHUB_SHA}")"; then
            :
          else
            config_code="000"
          fi

          if [ "$config_code" != "200" ]; then
            emit true "Could not read config.github.json (HTTP ${config_code}); generating."
            exit 0
          fi

          if ! langs="$(jq -r '.ai.languages[]' "$tmp")"; then
            emit true "Could not parse ai.languages; generating."
            exit 0
          fi

          if [ -z "$langs" ]; then
            emit true "No languages configured; generating."
            exit 0
          fi

          missing=0
          while IFS= read -r lang; do
            [ -n "$lang" ] || continue
            path="_posts/${shanghai_today}-summary-${lang}.md"
            code="000"
            if code="$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${path}?ref=gh-pages")"; then
              :
            else
              code="000"
            fi
            printf '%s -> HTTP %s\n' "$path" "$code"
            if [ "$code" != "200" ]; then
              missing=1
            fi
          done <<< "$langs"

          if [ "$missing" = "0" ]; then
            emit false "All ${shanghai_today} summary posts are already on gh-pages; skipping Horizon."
          else
            emit true "Shanghai ${shanghai_today} summary is not fully published; running Horizon."
          fi

  daily-summary:
    needs: already-published
    if: needs.already-published.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed to commit changes

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"

      - name: Install dependencies
        run: uv sync

      - name: Prepare GitHub Actions config
        run: cp data/config.github.json data/config.json

      - name: Run Horizon
        env:
          # config.github.json uses provider "ali" (DashScope / 通义,
          # api_key_env DASHSCOPE_API_KEY, model qwen-plus,
          # base_url https://dashscope.aliyuncs.com/compatible-mode/v1).
          # OPENAI_API_KEY, ANTHROPIC_API_KEY, and GOOGLE_API_KEY are unused with this provider.
          # Feishu is disabled, so HORIZON_WEBHOOK_URL is not mapped.
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          LWN_KEY: ${{ secrets.LWN_KEY }}
        run: uv run horizon --hours 24

      - name: Set current date as environment variable
        # Match the Pages post filename, which is the Asia/Shanghai date.
        # The runner clock is UTC, so an unzoned `date` would be yesterday
        # during an overnight slot.
        run: echo "DATE=$(TZ=Asia/Shanghai date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true  # Keep existing summaries on gh-pages branch
          commit_message: "📝 Daily Summary: ${{ env.DATE }}"
          publish_branch: gh-pages
          enable_jekyll: true
